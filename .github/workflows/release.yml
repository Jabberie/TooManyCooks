name: Build GitHub Release

on:
  push:
    tags:
      - '*_release'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build addon folder
        run: |
          mkdir -p build/TooManyCooks

          cp TooManyCooks.lua build/TooManyCooks/
          cp TooManyCooks.toc build/TooManyCooks/
          cp LICENSE build/TooManyCooks/

      - name: Replace project version
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i "s/@project-version@/${TAG}/g" build/TooManyCooks/TooManyCooks.toc

      - name: Create zip
        working-directory: build
        run: |
          zip -r ../TooManyCooks.zip TooManyCooks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TooManyCooks.zip
          generate_release_notes: true
          name: Too Many Cooks ${{ github.ref_name }}
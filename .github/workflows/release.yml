name: Build GitHub Release

on:
  workflow_dispatch:

  push:
    tags:
      - '*_release'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Determine version
      # -------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="development"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building TooManyCooks version: ${VERSION}"

      # -------------------------------------------------------
      # Build addon folder
      # -------------------------------------------------------
      - name: Build addon folder
        shell: bash
        run: |
          mkdir -p build/TooManyCooks

          # Copy addon files
          cp *.lua build/TooManyCooks/
          cp TooManyCooks.toc build/TooManyCooks/
          cp LICENSE build/TooManyCooks/

      # -------------------------------------------------------
      # Set packaged addon version
      # -------------------------------------------------------
      - name: Set addon version
        shell: bash
        run: |
          sed -i \
            "s/@project-version@/${{ steps.version.outputs.version }}/g" \
            build/TooManyCooks/TooManyCooks.toc

      # -------------------------------------------------------
      # Create installable WoW addon ZIP
      #
      # TooManyCooks.zip
      # └── TooManyCooks/
      #     ├── TooManyCooks.toc
      #     ├── Encounters.lua
      #     ├── UI.lua
      #     ├── SuspiciousStew.lua
      #     ├── AcceptableApprentice.lua
      #     ├── Core.lua
      #     └── LICENSE
      # -------------------------------------------------------
      - name: Create addon zip
        working-directory: build
        shell: bash
        run: |
          zip -r ../TooManyCooks.zip TooManyCooks

      # -------------------------------------------------------
      # Manual test builds
      # -------------------------------------------------------
      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: TooManyCooks
          path: TooManyCooks.zip
          if-no-files-found: error

      # -------------------------------------------------------
      # Tagged releases
      # -------------------------------------------------------
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Too Many Cooks ${{ github.ref_name }}
          files: TooManyCooks.zip
          generate_release_notes: true